<!doctype html>
<html lang="ja" data-theme="light" data-density="comfortable">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Settings pattern — G-Force UI</title><link rel="stylesheet" href="../assets/gforce.css"></head>
<body>
  <div class="gfu-app-shell">
    <header class="gfu-topbar" data-border="true"><button type="button" class="gfu-icon-button sm:hidden" aria-label="ナビゲーションを開く" aria-expanded="false" data-gfu-nav-toggle><span data-icon="menu"></span></button><a class="gfu-topbar__brand" href="../index.html"><span class="gfu-topbar__mark">TK</span><span class="gfu-topbar__name">TK Console</span></a><div class="gfu-topbar__actions"><button type="button" class="gfu-icon-button" aria-label="テーマを切り替える" data-gfu-theme-toggle><span data-icon="dark_mode" data-gfu-theme-icon></span></button><span class="gfu-avatar" data-size="sm">TK</span></div></header>
    <aside class="gfu-nav-drawer" aria-label="メインナビゲーション" data-gfu-nav-drawer data-open="false"><nav class="gfu-nav-drawer__section"><a class="gfu-nav-item" href="dashboard.html"><span data-icon="dashboard"></span><span class="gfu-nav-item__text">概要</span></a><a class="gfu-nav-item" href="list-detail.html"><span data-icon="folder"></span><span class="gfu-nav-item__text">プロジェクト</span></a><a class="gfu-nav-item" href="settings.html" aria-current="page"><span data-icon="settings"></span><span class="gfu-nav-item__text">設定</span></a><hr class="gfu-divider"><a class="gfu-nav-item" href="../index.html"><span data-icon="widgets"></span><span class="gfu-nav-item__text">カタログへ戻る</span></a></nav></aside><div class="gfu-nav-scrim" data-gfu-nav-scrim data-open="false"></div>
    <main class="gfu-app-main"><div class="gfu-page" data-width="form"><div class="gfu-page-header"><div class="gfu-page-header__copy"><nav class="gfu-breadcrumbs" aria-label="パンくず"><a href="dashboard.html">概要</a><span class="gfu-breadcrumbs__separator" data-icon="chevron_right"></span><span aria-current="page">設定</span></nav><h1 class="gfu-page-title mt-2">組織設定</h1><p class="gfu-page-header__description">組織情報、通知、セキュリティを管理します。</p></div></div>
      <div class="gfu-tabs" data-gfu-tabs><div class="gfu-tabs__list" role="tablist" aria-label="設定カテゴリ"><button id="settings-general-tab" type="button" class="gfu-tabs__tab" role="tab" aria-selected="true" aria-controls="settings-general-panel">一般</button><button id="settings-notification-tab" type="button" class="gfu-tabs__tab" role="tab" aria-selected="false" aria-controls="settings-notification-panel" tabindex="-1">通知</button><button id="settings-security-tab" type="button" class="gfu-tabs__tab" role="tab" aria-selected="false" aria-controls="settings-security-panel" tabindex="-1">セキュリティ</button></div>
        <section id="settings-general-panel" class="gfu-tabs__panel" role="tabpanel" aria-labelledby="settings-general-tab"><div class="gfu-card"><div class="gfu-card__header"><h2 class="gfu-title">基本情報</h2><p class="gfu-card__description">組織内で表示される名称と説明です。</p></div><div class="gfu-card__body"><form class="grid gap-5"><div class="gfu-field"><label class="gfu-field__label" for="organization-name">組織名</label><div class="gfu-field__control"><input id="organization-name" class="gfu-field__input" type="text" value="TK_Production"></div></div><div class="gfu-field" data-gfu-counter-field><label class="gfu-field__label" for="organization-description">説明</label><div class="gfu-field__control"><textarea id="organization-description" class="gfu-field__textarea" maxlength="160">Web制作、システム開発、eスポーツ事業。</textarea></div><div class="gfu-field__support-row"><p class="gfu-field__support">外部には公開されません。</p><p class="gfu-field__support gfu-field__counter" data-gfu-counter></p></div></div></form></div><div class="gfu-card__footer" data-gfu-action-group><button type="button" class="gfu-button" data-variant="text">変更を破棄</button><button type="button" class="gfu-button" data-variant="filled" data-gfu-loading-demo><span data-icon="save"></span><span class="gfu-button__label">保存する</span></button></div></div></section>
        <section id="settings-notification-panel" class="gfu-tabs__panel" role="tabpanel" aria-labelledby="settings-notification-tab" hidden><div class="gfu-card"><div class="gfu-card__header"><h2 class="gfu-title">通知</h2></div><div class="gfu-card__body"><div class="gfu-setting-row"><div><p class="gfu-setting-row__title">メール通知</p><p class="gfu-setting-row__support">重要な変更と障害を受信します。</p></div><label class="gfu-switch"><input class="gfu-switch__input" type="checkbox" checked><span class="gfu-visually-hidden">メール通知</span></label></div><div class="gfu-setting-row"><div><p class="gfu-setting-row__title">週次サマリー</p><p class="gfu-setting-row__support">毎週月曜日の10時に送信します。</p></div><label class="gfu-switch"><input class="gfu-switch__input" type="checkbox"><span class="gfu-visually-hidden">週次サマリー</span></label></div></div></div></section>
        <section id="settings-security-panel" class="gfu-tabs__panel" role="tabpanel" aria-labelledby="settings-security-tab" hidden><div class="grid gap-4"><div class="gfu-alert" data-tone="warning"><span data-icon="warning"></span><div><p class="gfu-alert__title">2段階認証が未設定のメンバーが2人います</p><p class="gfu-alert__body">組織の管理者には2段階認証を必須にしてください。</p></div></div><div class="gfu-list"><div class="gfu-list-item"><span data-icon="lock"></span><div class="gfu-list-item__content"><p class="gfu-list-item__title">2段階認証</p><p class="gfu-list-item__support">管理者に必須</p></div><button type="button" class="gfu-button" data-variant="outlined">管理</button></div><div class="gfu-list-item"><span data-icon="code"></span><div class="gfu-list-item__content"><p class="gfu-list-item__title">APIキー</p><p class="gfu-list-item__support">3件の有効なキー</p></div><button type="button" class="gfu-button" data-variant="outlined">管理</button></div></div></div></section>
      </div>
    </div></main>
  </div><div class="gfu-snackbar-stack" data-gfu-snackbar-stack aria-live="polite"></div><script type="module" src="../assets/gforce.js"></script>
</body></html>
