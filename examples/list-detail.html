<!doctype html>
<html lang="ja" data-theme="light" data-density="comfortable">

    <main class="gfu-app-main"><div class="gfu-page" data-width="wide"><div class="gfu-page-header"><div class="gfu-page-header__copy"><h1 class="gfu-page-title">プロジェクト</h1><p class="gfu-page-header__description">12件のプロジェクトを管理します。</p></div><div class="gfu-page-header__actions" data-gfu-action-group><button type="button" class="gfu-button" data-variant="filled"><span data-icon="add"></span><span>新規作成</span></button></div></div>
      <div class="gfu-filter-bar"><div class="gfu-filter-bar__search"><label class="gfu-search" data-gfu-search><span data-icon="search"></span><span class="gfu-visually-hidden">プロジェクトを検索</span><input class="gfu-search__input" type="search" placeholder="プロジェクトを検索"><button type="button" class="gfu-icon-button" aria-label="検索語を消去" data-gfu-search-clear hidden><span data-icon="close"></span></button></label></div><div class="gfu-chip-set"><button type="button" class="gfu-chip" aria-pressed="true" data-gfu-filter-chip>すべて</button><button type="button" class="gfu-chip" aria-pressed="false" data-gfu-filter-chip>公開中</button><button type="button" class="gfu-chip" aria-pressed="false" data-gfu-filter-chip>下書き</button></div><button type="button" class="gfu-icon-button" aria-label="並べ替え"><span data-icon="sort"></span></button></div>
      <div class="grid gap-6 mt-6 lg:grid-cols-3"><section class="lg:col-span-2"><div class="gfu-list"><button type="button" class="gfu-list-item w-full text-left" data-selected="true"><span data-icon="folder"></span><div class="gfu-list-item__content"><p class="gfu-list-item__title">G-Force UI</p><p class="gfu-list-item__support">Google系UIライブラリ · 12メンバー</p></div><span class="gfu-status" data-tone="success">公開中</span></button><button type="button" class="gfu-list-item w-full text-left" data-interactive="true"><span data-icon="folder"></span><div class="gfu-list-item__content"><p class="gfu-list-item__title">採用管理CMS</p><p class="gfu-list-item__support">採用業務システム · 4メンバー</p></div><span class="gfu-status" data-tone="warning">確認待ち</span></button><button type="button" class="gfu-list-item w-full text-left" data-interactive="true"><span data-icon="folder"></span><div class="gfu-list-item__content"><p class="gfu-list-item__title">TFT編集ツール</p><p class="gfu-list-item__support">動画編集支援 · 7メンバー</p></div><span class="gfu-status">下書き</span></button></div></section><aside class="gfu-card"><div class="gfu-card__header"><div class="flex items-start justify-between gap-3"><div><h2 class="gfu-title">G-Force UI</h2><p class="gfu-card__description">gforce-ui-001</p></div><button id="list-detail-sheet-trigger" type="button" class="gfu-icon-button" aria-label="詳細を編集" data-gfu-side-sheet-open="list-detail-sheet"><span data-icon="edit"></span></button></div></div><div class="gfu-card__body"><dl class="gfu-description-list"><dt>状態</dt><dd><span class="gfu-status" data-tone="success">公開中</span></dd><dt>所有者</dt><dd>TK_Production</dd><dt>メンバー</dt><dd>12人</dd><dt>最終更新</dt><dd>3分前</dd></dl></div><div class="gfu-card__footer"><button type="button" class="gfu-button" data-variant="outlined">開く</button></div></aside></div>
    </div></main></div>
  <aside id="list-detail-sheet" class="gfu-side-sheet" aria-labelledby="list-detail-sheet-title" aria-hidden="true" data-gfu-side-sheet data-open="false"><header class="gfu-side-sheet__header"><h2 id="list-detail-sheet-title" class="gfu-side-sheet__title">詳細を編集</h2><button type="button" class="gfu-icon-button" aria-label="閉じる" data-gfu-side-sheet-close><span data-icon="close"></span></button></header><div class="gfu-side-sheet__body"><div class="grid gap-5"><div class="gfu-field"><label class="gfu-field__label" for="detail-name">プロジェクト名</label><div class="gfu-field__control"><input id="detail-name" class="gfu-field__input" type="text" value="G-Force UI"></div></div><div class="gfu-field"><label class="gfu-field__label" for="detail-status">状態</label><div class="gfu-field__control"><div class="gfu-select-wrap"><select id="detail-status" class="gfu-field__select"><option>公開中</option><option>下書き</option><option>アーカイブ</option></select><span data-icon="expand_more"></span></div></div></div></div></div><footer class="gfu-side-sheet__footer"><button type="button" class="gfu-button" data-variant="text" data-gfu-side-sheet-close>キャンセル</button><button type="button" class="gfu-button" data-variant="filled" data-gfu-side-sheet-close data-gfu-snackbar="プロジェクトを更新しました。">保存する</button></footer></aside><div class="gfu-overlay" data-gfu-overlay data-open="false"></div><div class="gfu-snackbar-stack" data-gfu-snackbar-stack aria-live="polite"></div><script type="module" src="../assets/gforce.js"></script>
