name: Import G-Force UI v1.0.0

on:
  push:
    branches: [main]
    paths:
      - '.bootstrap-v2/**'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  import:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout staging commit
        uses: actions/checkout@v4

      - name: Reassemble and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          test "$(find .bootstrap-v2 -maxdepth 1 -name 'part*.b64' | wc -l)" -eq 11
          cat .bootstrap-v2/part*.b64 | tr -d '\n\r' | base64 --decode > /tmp/gforce-ui.tar.xz
          echo 'f5e909ad3365f0664c3f1f0901f7513a304d2be7f68201215b469de5a7825361  /tmp/gforce-ui.tar.xz' | sha256sum --check --strict
          xz --test /tmp/gforce-ui.tar.xz

      - name: Replace staging files with project source
        shell: bash
        run: |
          set -euo pipefail
          find . -mindepth 1 -maxdepth 1 ! -name '.git' -exec rm -rf -- {} +
          tar -xJf /tmp/gforce-ui.tar.xz -C .

      - name: Install dependencies and run full checks
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-audit --no-fund
          npm run check

      - name: Commit verified project source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git diff --cached --check
          git commit -m "feat: add G-Force UI v1.0.0 source"
          git push origin HEAD:main
