name: Bootstrap G-Force UI source

on:
  push:
    branches: [main]
    paths:
      - 'gforce-src.zip'
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Extract source bundle
        run: |
          unzip -o gforce-src.zip
          rm -f gforce-src.zip

      - name: Install and verify
        run: |
          npm install
          npm run check

      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/bootstrap.yml

      - name: Commit expanded source
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add G-Force UI v1.0.0 source" || exit 0
          git push
