# bootstrap revision: final-2
name: Bootstrap G-Force UI source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify bootstrap chunks
        shell: bash
        run: |
          set -euo pipefail
          test "$(wc -c < .bootstrap/part00.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part01.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part02.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part03.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part04.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part05.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part06.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part07.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part08.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part09.b64)" -eq 8000
          test "$(wc -c < .bootstrap/part10.b64)" -eq 5468
          echo '7566c9ca0c2e918165b6df86743771569f9dca5cf1076f0e817266b4022f2715  .bootstrap/part00.b64' | sha256sum --check --strict
          echo '2487f8732a358c75aea161ab548f666929081208106c6592bbf6734ce0ad0cea  .bootstrap/part01.b64' | sha256sum --check --strict
          echo '067890700e2cd983ff5061afa833c321eae6b50b77007b326bb4b52fb02f02ad  .bootstrap/part02.b64' | sha256sum --check --strict
          echo '7c54808f1f3192621bdf1930ca4f360933b575bcf3ed9d2913a3a9589ecafd0d  .bootstrap/part03.b64' | sha256sum --check --strict
          echo '508ab647a6b2bb5bdabcc83febbf5e52bf148ad390ceda21e10023ce458db9ae  .bootstrap/part04.b64' | sha256sum --check --strict
          echo 'bd8bcbdbb775f04f393c4213a215c66dcbf844c565fc5dcde80a22d00f237116  .bootstrap/part05.b64' | sha256sum --check --strict
          echo 'da1d2fba494b715b0d86376bae1953852c0b86b867349629c467ca325c272f05  .bootstrap/part06.b64' | sha256sum --check --strict
          echo '2159eabdaeccbe024475b8f45c5cab184c608864d9a9d2258d15524fabac9454  .bootstrap/part07.b64' | sha256sum --check --strict
          echo '589bdb93da84dc802715dd5973d2a88e5ed2e394a79fd266f4d3363b24cf82cb  .bootstrap/part08.b64' | sha256sum --check --strict
          echo '5844f9930cc84625f7b406d634e94130a0ce7af99d3837a5afe2ad9a9c44d946  .bootstrap/part09.b64' | sha256sum --check --strict
          echo 'b12c042d3e5bfb465450baab4d2fe97c75c09969d86afed5750f8bdbc4cc6ad5  .bootstrap/part10.b64' | sha256sum --check --strict

      - name: Reassemble and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 | tr -d '\n\r' | base64 --decode > gforce-src.tar.xz
          echo 'f5e909ad3365f0664c3f1f0901f7513a304d2be7f68201215b469de5a7825361  gforce-src.tar.xz' | sha256sum --check --strict
          xz --test gforce-src.tar.xz

      - name: Extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf gforce-src.tar.xz
          rm -f gforce-src.tar.xz gforce-src.zip
          rm -rf .bootstrap

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/bootstrap.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add G-Force UI v1.0.0 source"
          git push
