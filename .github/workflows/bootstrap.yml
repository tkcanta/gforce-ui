name: Bootstrap G-Force UI source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/bootstrap.yml'

permissions:
  contents: write

jobs:
  bootstrap:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Inspect bootstrap chunks
        shell: bash
        run: |
          set -euo pipefail
          for f in .bootstrap/part*.b64; do
            wc -c "$f"
            sha256sum "$f"
            LC_ALL=C grep -n '[^A-Za-z0-9+/=]' "$f" | head -3 || true
          done

      - name: Reassemble and verify source bundle
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part*.b64 | tr -d '\n\r' | base64 --decode > gforce-src.tar.xz
          echo '20cdcdd297835698b5b40c4d169da92c1df7910c90564bb517de472ebe522456  gforce-src.tar.xz' | sha256sum --check --strict
          xz --test gforce-src.tar.xz

      - name: Extract source bundle
        shell: bash
        run: |
          set -euo pipefail
          tar -xJf gforce-src.tar.xz
          rm -f gforce-src.tar.xz gforce-src.zip
          rm -rf .bootstrap

      - name: Install and verify
        shell: bash
        run: |
          set -euo pipefail
          npm install
          npm run check

      - name: Remove bootstrap workflow
        run: rm -f .github/workflows/bootstrap.yml

      - name: Commit expanded source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: add G-Force UI v1.0.0 source"
          git push
